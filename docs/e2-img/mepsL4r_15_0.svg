b" text-anchor="start" dominant-baseline="middle">运算</text><rect x="650" y="222" width="120" height="32" rx="16.0" ry="16.0" fill="#fff" stroke="#ff3355" stroke-width="2"/><text x="710" y="238" font-size="22" font-weight="800" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">n ÷ 2</text><rect x="500" y="262" width="740" height="48" rx="14" ry="14" fill="#ffab19" stroke="#cf8b17" stroke-width="3"/><text x="516" y="286" font-size="22" font-weight="800" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#1e293b" text-anchor="start" dominant-baseline="middle">否则</text><rect x="536" y="306" width="704" height="56" rx="14" ry="14" fill="#ffab19" stroke="#cf8b17" stroke-width="3"/><text x="552" y="334" font-size="22" font-weight="800" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#1e293b" text-anchor="start" dominant-baseline="middle">停止这个脚本</text><text x="40" y="670" font-size="20" font-weight="800" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#475569" text-anchor="start" dominant-baseline="middle">点图片可以放大。绿旗先把 s 变成 0，再运算 15，最后说 s。</text></svg>