<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="description" content="小鱼 Leo 的 E2 图形化编程建模赛前复习课：能听、能点、少字多图">
<title>🐟 小鱼的积木比赛 · E2 复习</title>
<style>
:root{
  --sky:#d7f0ff; --ink:#1e3a5f; --muted:#5b6c86;
  --card:#fff; --ok:#16a34a; --bad:#dc2626;
  --star:#f59e0b; --shadow:0 10px 28px rgba(30,80,140,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(#9ddcff 0%, var(--sky) 38%, #fff7e8 100%);
  color:var(--ink); line-height:1.45;
}
button{font-family:inherit;cursor:pointer}
#app{max-width:860px;margin:0 auto;padding:16px 14px 120px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.topbar a,.ghost{
  background:#fff;border:0;border-radius:999px;padding:8px 14px;
  text-decoration:none;color:var(--ink);font-weight:700;box-shadow:var(--shadow)
}
.stars{margin-left:auto;font-size:1.15rem;font-weight:800;color:#b45309}
h1{font-size:clamp(1.6rem,5vw,2.2rem);margin:.2em 0;line-height:1.85}
.sub{color:var(--muted);font-size:1.05rem;margin:0 0 18px}
.hero{
  background:var(--card);border-radius:28px;padding:22px 20px 18px;
  box-shadow:var(--shadow);text-align:center;margin-bottom:16px
}
.mascot{font-size:4.2rem;line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.06))}
.bubble{
  display:inline-block;background:#fff;border:3px solid #7dd3fc;
  border-radius:22px;padding:12px 16px;margin:10px 0 0;font-size:1.2rem;font-weight:700
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.mod{
  background:var(--card);border:0;border-radius:22px;padding:16px;text-align:left;
  box-shadow:var(--shadow);min-height:118px;border-top:10px solid var(--c,#38bdf8)
}
.mod .ic{font-size:2rem}
.mod h3{margin:6px 0 4px;font-size:1.25rem}
.mod p{margin:0;color:var(--muted);font-size:.95rem}
.mod.done{opacity:.92}
.badge{display:inline-block;margin-top:8px;font-weight:800;color:#16a34a}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.big{
  border:0;border-radius:18px;padding:16px 22px;font-size:1.2rem;font-weight:800;
  background:linear-gradient(135deg,#fb923c,#f43f5e);color:#fff;box-shadow:var(--shadow)
}
.big.sec{background:linear-gradient(135deg,#38bdf8,#6366f1)}
.big.ok{background:linear-gradient(135deg,#22c55e,#16a34a)}
.card{
  background:var(--card);border-radius:26px;padding:20px 18px 18px;
  box-shadow:var(--shadow);margin-top:8px
}
.prog{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin:8px 0 14px}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#38bdf8);transition:width .3s}
.emoji{font-size:4rem;text-align:center;line-height:1;margin:4px 0 8px}
.title{font-size:1.55rem;margin:0 0 8px;text-align:center}
.lines{font-size:1.28rem;margin:0}
.lines p{margin:.45em 0}
.opts{display:grid;gap:12px;margin-top:14px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border:4px solid #e2e8f0;background:#f8fafc;border-radius:18px;padding:12px 14px;
  font-size:1.22rem;font-weight:800;color:var(--ink)
}
.opt .e{font-size:2.2rem;width:52px;text-align:center}
.opt:active{transform:scale(.98)}
.opt.good{border-color:#16a34a;background:#dcfce7}
.opt.bad{border-color:#dc2626;background:#fee2e2}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;min-height:88px;font-size:1.5rem}
.fb{min-height:2.4em;font-size:1.15rem;font-weight:700;text-align:center;margin:12px 0 4px}
.fb.good{color:var(--ok)} .fb.bad{color:var(--bad)}
.palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.blk{
  border:0;border-radius:12px;padding:12px 14px;font-weight:800;color:#0f172a;
  font-size:1.05rem;min-width:120px;box-shadow:0 4px 0 rgba(0,0,0,.12)
}
.stack{min-height:168px;background:#0f172a;border-radius:16px;padding:10px;margin:10px 0}
.slot{
  height:46px;border:2px dashed #64748b;border-radius:10px;margin:8px;
  display:flex;align-items:center;justify-content:center;color:#94a3b8;font-weight:700
}
.slot.filled{border-style:solid;color:#0f172a;font-weight:800}
.checks{display:grid;gap:10px}
.check{
  display:flex;align-items:center;gap:12px;background:#f8fafc;border-radius:16px;
  padding:12px;border:3px solid #e2e8f0
}
.check.on{border-color:#16a34a;background:#ecfdf5}
.check .e{font-size:2rem}
.tiny{font-size:.9rem;color:var(--muted);text-align:center}
.parent{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);font-size:1.02rem}
.parent h2{margin-top:0}
.parent a{color:#0369a1}
.fab{
  position:fixed;right:16px;bottom:16px;z-index:20;
  width:68px;height:68px;border-radius:50%;border:0;font-size:1.8rem;
  background:#0ea5e9;color:#fff;box-shadow:0 8px 20px rgba(14,165,233,.45)
}
.fab.home{right:92px;background:#f97316;font-size:1.4rem}
.clock{
  width:160px;height:160px;border-radius:50%;margin:8px auto;background:#fff;
  border:10px solid #0f172a;position:relative
}
.clock:before,.clock:after{content:"";position:absolute;background:#0f172a;left:50%;transform-origin:bottom center}
.clock:before{width:6px;height:42px;top:38px;margin-left:-3px;transform:rotate(60deg);border-radius:4px}
.clock:after{width:6px;height:28px;top:52px;margin-left:-3px;transform:rotate(-90deg);border-radius:4px}
.stage{
  background:linear-gradient(#7dd3fc,#bbf7d0);border:8px solid #1e293b;border-radius:16px;
  height:140px;display:flex;align-items:flex-end;justify-content:center;font-size:4rem;margin:8px auto 4px
}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.areas div{background:#f1f5f9;border-radius:14px;padding:10px;text-align:center;font-weight:800}
.cert{text-align:center;padding:12px}
.cert .cup{font-size:5rem}
.hanzi{display:block;line-height:1.15}
ruby{ruby-position:over;ruby-align:center}
rt{font-size:.48em;color:#64748b;font-weight:700;letter-spacing:.02em;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.title{line-height:1.85}
.opt .han{flex:1;font-size:1.12rem;font-weight:800;line-height:1.85;text-align:left}
.opt .e{flex:0 0 52px}
.scorebar{background:#fff7ed;border:3px solid #fdba74;border-radius:16px;padding:10px 14px;text-align:center;font-weight:800;margin:8px 0 12px;color:#9a3412}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.confetti i{position:absolute;top:-20px;font-size:1.6rem;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(240deg);opacity:.2}}
.tier{font-size:1.05rem;color:#475569;margin:.4em 0 1em}
.papers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.paper{
  border:4px solid #e2e8f0;background:#fff;border-radius:18px;padding:12px 10px;
  font-weight:800;color:var(--ink);text-align:center;font-size:1.05rem
}
.paper .ic{font-size:1.8rem;display:block}
.paper.on{border-color:#f59e0b;background:#fff7ed}
.paper .best{display:block;margin-top:4px;font-size:.8rem;color:#9a3412}
@media (max-width:520px){
  .title{font-size:1.32rem}.lines{font-size:1.12rem}
  .tf{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab home" id="btnHome" title="回家">🏠</button>
<button class="fab" id="btnSpeak" title="再听一遍">🔊</button>

}
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function rubyize(s){
  if(!s) return "";
  let out = "", buf = "";
  const flush = () => { if(buf){ out += escapeHtml(buf); buf = ""; } };
  for(const ch of String(s)){
    if(/[\u4e00-\u9fff]/.test(ch)){
      flush();
      const py = PY[ch];
      out += py ? `<ruby>${ch}<rt>${escapeHtml(py)}</rt></ruby>` : ch;
    } else buf += ch;
  }
  flush();
  return out;
}
function pickVoice(){
  const vs = speechSynthesis.getVoices() || [];
  if(!vs.length) return null;
  const score = v => {
    const n = (v.name + " " + v.lang).toLowerCase();
    if(/xiaoxiao|xiaoyi|xiaoyan|xiaoshuang|xiaomeng|yaoyao|huihui|yunxi|yunyang/.test(n)) return 120;
    if(/tingting|ting-ting|meijia|hanhan/.test(n)) return 110;
    if(/female|女/.test(n) && /zh/.test(n)) return 90;
    if(/google/.test(n) && /zh|chinese|中文|普通话/.test(n)) return 80;
    if(/zh-cn/.test(n)) return 60;
    if(/zh|chinese|中文/.test(n)) return 50;
    return 0;
  };
  return [...vs].sort((a,b) => score(b) - score(a))[0];
}
function speakChunks(text){
  const sentences = String(text).split(/[。！？!?；;\n]+/).map(s => s.trim()).filter(Boolean);
  const out = [];
  sentences.forEach(s => {
    if(s.length > 16 && /[，,]/.test(s)){
      s.split(/[，,]/).map(x => x.trim()).filter(Boolean).forEach(x => out.push(x));
    } else out.push(s);
  });
  return out.length ? out : [String(text)];
}
function speak(text){
  lastSpeak = text || lastSpeak;
  if(!text) text = lastSpeak;
  if(!text) return;
  try{
    window.speechSynthesis.cancel();
    const token = ++speakToken;
    preferredVoice = pickVoice() || preferredVoice;
    const parts = speakChunks(text);
    const sayOne = (i) => {
      if(token !== speakToken || i >= parts.length) return;
      const u = new SpeechSynthesisUtterance(parts[i]);
      u.lang = "zh-CN";
      u.rate = 0.72;
      u.pitch = 1.08;
      u.volume = 1;
      if(preferredVoice) u.voice = preferredVoice;
      u.onend = () => setTimeout(() => sayOne(i + 1), 420);
      speechSynthesis.speak(u);
    };
    sayOne(0);
  }catch(e){}
}
speechSynthesis.onvoiceschanged = () => { preferredVoice = pickVoice(); };

const MIX_I = PAPERS.length;
let paperI = 0;
let mixedQs = null;
function examQs(){ return paperI === MIX_I ? (mixedQs || []) : PAPERS[paperI].qs; }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function uniqPrompt(list){
  const seen = new Set();
  return list.filter(q => { if(seen.has(q.prompt)) return false; seen.add(q.prompt); return true; });
}
function mixPaper(){
  const all = PAPERS.flatMap(p => p.qs);
  const choice = shuffle(uniqPrompt(all.filter(q => !q.tf))).slice(0, 20);
  const tf = shuffle(uniqPrompt(all.filter(q => q.tf))).slice(0, 10);
  return choice.concat(tf);
}

  const n = items.filter(i=>device[i.k]).length;
  return `    <h2 class="title">点亮 5 颗检查星</h2>
    <p class="tiny">家长帮忙点。小鱼看绿灯就好。</p>
    ${chromeOk?"":"<p class=\"tiny\">家长注意：考试只用谷歌 Chrome，不要用 Edge、Firefox、Safari。</p>"}
    <div class="checks">
      ${items.map(i=>`<div class="check ${device[i.k]?"on":""}">
        <span class="e">${i.e}</span>
        <div style="flex:1"><b>${i.t}</b><div class="tiny" style="text-align:left">${device[i.k]?"亮啦 ★":"还没亮"}</div></div>
        <button class="big sec" data-k="${i.k}" style="padding:10px 14px;font-size:1rem">检查</button>
      </div>`).join("")}
    </div>
    <video id="camv" playsinline muted style="display:${device.cam?"block":"none"};width:100%;max-height:160px;border-radius:12px;margin-top:8px;background:#000"></video>
    <p class="tiny">已点亮 ${n} / 5</p>
    <div class="row"><button class="big" id="next">下一页 ▶</button></div>`;
}

function htmlParent(){
  return `<div class="parent">
    <h2>给爸爸妈妈</h2>
    <p>孩子请回上一页玩大按钮。下面按 2026-09 说明会更新（来源 lcxyun / simcc 公开材料）。规则以官网当天页面为准。</p>
    <ul>
      <li><b>赛项</b>：E2 图形化编程建模 · <b>全程个人赛 · 考核 Scratch</b></li>
      <li><b>小学低年级初赛</b>：<b>9 月 13 日 14:00–15:00</b>（别的组别 15:00–16:00，进不去）</li>
      <li><b>初赛题量</b>：<b>20 道单选 + 10 道判断</b>；选择 4 分、判断 2 分，满分 100</li>
      <li><b>后面才编程</b>：复赛 10 选 + 10 判 + 2 道编程；决赛 5 道编程。初赛只点对错。</li>
      <li><b>练 / 赛</b>：平台蓝按钮「模拟比赛」只练设备；橙按钮「正式比赛」<b>每人只有一次</b></li>
      <li><b>进入</b>：官网登录 → 个人中心 → 赛事足迹 → 参加测评</li>
      <li><b>电脑</b>：Win10 / macOS 11+，内存 8G，C 盘 4G，Chrome ≥109（不要 Edge/Firefox/Safari），前置摄像头，约 50Mbps，电量充足</li>
      <li><b>监考</b>：另一部手机/平板，微信 ≥8.0.30；页面和监控不要关，否则可能判作弊</li>
      <li><b>支持</b>：李老师 17675966796 · 咨询 010-58800540</li>
    </ul>
    <p>网页课里的「模拟考」是给孩子练手的，<b>不是</b>官网那一次正式考试。</p>
    <div class="row">
      <button class="big sec" id="back">← 回复习课</button>
      <button class="big" id="reset" style="background:#64748b">清空星星重来</button>
    </div>
  </div>`;
}

function htmlExamHub(){
  const mixOn = paperI === MIX_I;
  const papers = PAPERS.map((p,i)=>{
    const best = state.paperBest && state.paperBest[p.id];
    return `<button class="paper ${paperI===i?"on":""}" data-p="${i}">
      <span class="ic">${p.ic}</span>${rubyize(p.name)}
      ${best?`<span class="best">${rubyize("最好 "+best+" 分")}</span>`:""}
    </button>`;
  }).join("");
  const mixBest = state.paperBest && state.paperBest.mix;
  return `<div class="emoji">⭐</div>
    <h2 class="title">${rubyize("闯关小测验")}</h2>
    <p class="lines" style="text-align:center">${rubyize("先选一套。每套都是三十题。")}</p>
    <p class="tiny">${rubyize("对照初赛：20 道选择 + 10 道判断，满分 100 分")}</p>
    <div class="papers">${papers}
      <button class="paper ${mixOn?"on":""}" data-p="${MIX_I}" style="grid-column:1/-1">
        <span class="ic">🎲</span>${rubyize("幸运卷 · 题库里抽三十题")}
        ${mixBest?`<span class="best">${rubyize("最好 "+mixBest+" 分")}</span>`:""}
      </button>
    </div>
    <div class="row">
      <button class="big ok" id="prac">😊 练一练<br><span style="font-size:.8rem;font-weight:600">选错了可以再选</span></button>
      <button class="big" id="exam">📝 模拟考<br><span style="font-size:.8rem;font-weight:600">一遍过，看分数</span></button>
    </div>`;
}

function htmlExamQ(){
  const qs = examQs();
  const s = qs[examI];
  const pct = Math.round(examI/qs.length*100);
  const pname = paperI === MIX_I ? "幸运卷" : PAPERS[paperI].name;
  return `<div class="prog"><i style="width:${pct}%"></i></div>
    <div class="scorebar">${rubyize(pname+" · 第 "+(examI+1)+" / "+qs.length+" 题")}　·　${rubyize("已得 "+examPts+" 分")}</div>
    ${htmlQuiz(s, true)}`;
}

function scoreTier(pct){
  if(pct >= 90) return {
    cup:"🏆", title:"超级小鱼冠军",
    speak:"哇，太厉害啦。你是超级小鱼冠军。星星都为你闪亮。",
    line:"金牌闪闪，小鱼最棒！"
  };
  if(pct >= 75) return {
    cup:"🌟", title:"闪亮小明星",
    speak:"真厉害呀。你是闪亮小明星。再听一听错过的题，就会更棒。",
    line:"银光闪闪，继续加油！"
  };
  if(pct >= 60) return {
    cup:"💪", title:"勇敢小探险家",
    speak:"你已经很勇敢啦。再玩一遍，分数还会往上爬。",
    line:"铜牌到手，再闯一关！"
  };
  return {
    cup:"🐟", title:"不怕，再来一次",
    speak:"没关系呀。小鱼每次试，都会更懂一点。我们再玩一遍吧。",
    line:"勇气金牌，已经出发！"
  };
}

function htmlExamEnd(){
  const qs = examQs();
  const full = examFull();
  const pct = full ? Math.min(100, Math.round(examPts/full*100)) : 0;
  const pid = paperI === MIX_I ? "mix" : PAPERS[paperI].id;
  if(examMode){
    if(pct>state.examBest){ state.examBest=pct; }
    if(!state.paperBest) state.paperBest = {};
    if(!(pid in state.paperBest) || pct>state.paperBest[pid]) state.paperBest[pid]=pct;
    save();
  }
  markDone("m7");
  const tier = scoreTier(pct);
  const wr = examWrong.map(w=>`<li>${rubyize(w.prompt)} → ${rubyize(w.why)}</li>`).join("");
  const allRight = examScore === qs.length && !examWrong.length;
  const confetti = pct>=60 ? `<div class="confetti">${Array.from({length:22},(_,i)=>`<i style="left:${4+i*4.4}%;animation-delay:${(i%7)*0.12}s">${["⭐","🎉","🐟","🌟","🎈"][i%5]}</i>`).join("")}</div>` : "";
  const pname = paperI === MIX_I ? "幸运卷" : PAPERS[paperI].name;
  return `${confetti}<div class="cert">
    <div class="cup">${tier.cup}</div>
    <h2 class="title">${rubyize(tier.title)}</h2>
    <p class="lines">${rubyize(pname)} · ${rubyize("答对 "+examScore+" / "+qs.length+" 题")}</p>
    <div class="scorebar">${rubyize("得分 "+examPts+" / "+full)}　·　${rubyize("大约 "+pct+" 分")}</div>
    <p class="tier">${rubyize(tier.line)}</p>
    ${wr?`<p><b>${rubyize("再听这些：")}</b></p><ul style="text-align:left">${wr}</ul>`:(allRight?`<p>${rubyize("全对！太棒了！")}</p>`:"")}
    <div class="row"><button class="big" id="again">再来一次</button>
      <button class="big sec" id="back">回家</button></div>
  </div>`;
}

function currentSpeak(){
  if(view==="home") return "小鱼你好呀。点开始复习吧。也可以先点一个关卡。";
  if(view==="parent") return "这一页是给爸爸妈妈看的。";
  if(view==="doneMod") return "这一关亮起来啦。你真厉害。";
  if(view==="examHub") return "先选一套卷子吧。小鱼卷、小猫卷、彩虹卷、星星卷，还可以抽幸运卷。每套三十题。";
  if(view==="examQ") return examQs()[examI].speak;
  if(view==="examEnd") {
    const full = examFull();
    const pct = full ? Math.round(examPts/full*100) : 0;
    return scoreTier(pct).speak;
  }
  const s = STEPS[mid][step];
  return s.speak || s.prompt || "";
}

function render(skipSpeak){
  const app = document.getElementById("app");
  const shown = Object.keys(state.done).length;
  let body = `<div class="topbar"><span class="stars">⭐ ${state.stars} · ${shown}/${MODULES.length} 关</span></div>`;

  if(view==="home") body += htmlHome();
  else if(view==="parent") body += htmlParent();
  else if(view==="examHub") body += `<div class="card">${htmlExamHub()}</div>`;
  else if(view==="examQ") body += `<div class="card">${htmlExamQ()}</div>`;
  else if(view==="examEnd") body += `<div class="card">${htmlExamEnd()}</div>`;
  else if(view==="doneMod"){
    const m = MODULES.find(x=>x.id===mid);
    body += `<div class="card cert"><div class="cup">⭐</div>
      <h2 class="title">${m.ic} ${rubyize(m.name + " 亮啦")}</h2>
      <p class="lines">${rubyize("小鱼真棒！")}</p>
      <div class="row"><button class="big" id="back">回地图</button>
      <button class="big sec" id="nextMod">下一关 ▶</button></div></div>`;
  } else {
    const m = MODULES.find(x=>x.id===mid);
    const arr = STEPS[mid];
    const s = arr[step];
    const pct = Math.round(step/arr.length*100);
    body += `<div class="card">
      <p class="tiny">${m.ic} ${m.name} · ${step+1}/${arr.length}</p>
      <div class="prog"><i style="width:${pct}%"></i></div>
      ${s.type==="say"?htmlSay(s):""}
      ${s.type==="quiz"?htmlQuiz(s,true):""}
      ${s.type==="order"?htmlOrder(s):""}
      ${s.type==="device"?htmlDevice():""}
    </div>`;
  }
  app.innerHTML = body;
  bind();
  const v = document.getElementById("camv");
  if(v && camStream){ v.srcObject = camStream; v.play().catch(()=>{}); }
  if(!skipSpeak) speak(currentSpeak());
}

function bind(){
  document.getElementById("goStart")?.addEventListener("click", ()=>{
    const first = MODULES.find(m=>!state.done[m.id]) || MODULES[0];
    if(first.id==="m7"){ view="examHub"; render(); }
    else openMod(first.id);
  });
  document.getElementById("goParent")?.addEventListener("click", ()=>{ view="parent"; render(); });
  document.getElementById("back")?.addEventListener("click", goHome);
  document.getElementById("reset")?.addEventListener("click", ()=>{
    localStorage.removeItem(STORE);
    state.stars = 0; state.done = {}; state.examBest = 0; state.paperBest = {};
    goHome();
  });
  document.getElementById("again")?.addEventListener("click", ()=>{ view="examHub"; render(); });
  document.getElementById("nextMod")?.addEventListener("click", ()=>{
    const i = MODULES.findIndex(x=>x.id===mid);
    const n = MODULES[i+1];
    if(!n) goHome();
    else if(n.id==="m7"){ view="examHub"; render(); }
    else openMod(n.id);
  });
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick = ()=>{
    if(b.dataset.m==="m7"){ view="examHub"; render(); }
    else openMod(b.dataset.m);
  });
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick = ()=>{
    paperI = +b.dataset.p;
    render(true);
    const name = paperI === MIX_I ? "幸运卷" : PAPERS[paperI].name;
    speak(name + "。点练一练，或者点模拟考。");
  });
  document.getElementById("prac")?.addEventListener("click", ()=> startExam(false));
  document.getElementById("exam")?.addEventListener("click", ()=> startExam(true));
  document.getElementById("next")?.addEventListener("click", ()=>{
    if(view==="examQ") examAdvance();
    else nextStep();
  });

  const quizRoot = view==="examQ" ? examQs()[examI] : (view==="mod" ? STEPS[mid][step] : null);
  if(quizRoot && quizRoot.type!=="order" && quizRoot.type!=="device" && quizRoot.options){
    wireQuiz(quizRoot, view==="examQ" && examMode);
  }
  if(view==="mod" && STEPS[mid][step].type==="order") wireOrder(STEPS[mid][step]);
  if(view==="mod" && STEPS[mid][step].type==="device") wireDevice();
}

function startExam(mode){
  if(paperI === MIX_I) mixedQs = mixPaper();
  examMode = mode; examI=0; examScore=0; examPts=0; examWrong=[]; picked=null;
  view="examQ"; render();
}

function wireQuiz(s, isExam){
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick = ()=>{
      if(picked!==null && (!isExam && examMode===false) && document.getElementById("next")?.disabled===false && !isExam){
        // already answered in practice with next enabled - ignore extra
      }
      const i = +b.dataset.i;
      const o = s.options[i];
      const fb = document.getElementById("fb");
      const next = document.getElementById("next");
      if(!isExam){
        document.querySelectorAll(".opt").forEach(x=>x.classList.remove("good","bad"));
        if(o.ok){
          b.classList.add("good");
          fb.className="fb good"; fb.innerHTML=rubyize("对啦！"+ (s.why||""));
          speak("对啦，真棒。"+ (s.why||""));
          next.disabled=false; next.style.opacity=1;
          picked=i;
          if(view==="examQ"){ examScore++; examPts += qPts(s); }
        }else{
          b.classList.add("bad");
          fb.className="fb bad"; fb.innerHTML=rubyize("再想想。"+ (s.why||""));
          speak("没关系，再想想。"+ (s.why||""));
          picked=null;
          if(view==="examQ" && isExam && !examWrong.includes(s)) examWrong.push(s);
        }
      }else{
        if(picked!==null) return;
        picked=i;
        document.querySelectorAll(".opt").forEach(x=>x.classList.remove("good","bad"));
        b.classList.add(o.ok?"good":"bad");
        if(!o.ok){
          const right = s.options.find(x=>x.ok);
          [...document.querySelectorAll(".opt")].forEach((x,idx)=>{ if(s.options[idx].ok) x.classList.add("good"); });
        }
        fb.className="fb "+(o.ok?"good":"bad");
        fb.innerHTML=rubyize((o.ok?"对啦！":"这题先记着。")+ (s.why||""));
        speak((o.ok?"对啦，真棒。":"这题先记着，下次就知道啦。")+ (s.why||""));
        if(o.ok){ examScore++; examPts += qPts(s); } else examWrong.push(s);
        next.disabled=false; next.style.opacity=1;
      }
    };
  });
}

function examAdvance(){
  if(examI < examQs().length-1){ examI++; picked=null; view="examQ"; render(); }
  else { view="examEnd"; render(); }
}

function wireOrder(s){
  document.querySelectorAll(".blk[data-id]").forEach(b=>{
    b.onclick = ()=>{
      if(orderSel.length>=3) return;
      orderSel.push(b.dataset.id);
      render(true);
    };
  });
  document.getElementById("undo")?.addEventListener("click", ()=>{
    orderSel.pop();
    render(true);
  });
  document.getElementById("chkOrder")?.addEventListener("click", ()=>{
    const fb = document.getElementById("fb");
    const next = document.getElementById("next");
    const ok = s.answer.every((id,i)=>orderSel[i]===id) && orderSel.length===3;
    if(ok){
      fb.className="fb good"; fb.textContent="排队成功！"+s.why;
      speak("排队成功。"+s.why);
      next.disabled=false; next.style.opacity=1;
    }else{
      fb.className="fb bad"; fb.textContent="再排一次。先绿旗，再走路，再说你好。";
      speak("再排一次。先绿旗，再走路，再说你好。");
      orderSel=[];
      render(true);
    }
  });
}

function wireDevice(){
  device.net = navigator.onLine;
  document.querySelectorAll("[data-k]").forEach(b=>{
    b.onclick = async ()=>{
      const k = b.dataset.k;
      if(k==="chrome"){
        device.chrome = true;
      }else if(k==="sound"){
        device.sound = true;
        speak("喇叭好了。小鱼能听见吗？");
      }else if(k==="click"){
        device.click = true;
      }else if(k==="net"){
        device.net = navigator.onLine;
      }else if(k==="cam"){
        try{
          camStream = await navigator.mediaDevices.getUserMedia({video:true, audio:false});
          device.cam = true;
          render(true);
          return;
        }catch(e){
          device.cam = true; // 允许跳过，避免卡住孩子
        }
      }
      render(true);
    };
  });
}

render();
</script>
</body>
</html>
