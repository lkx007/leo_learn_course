fill="#ffab19" stroke="#cf8b17" stroke-width="3"/><text x="56" y="294" font-size="22" font-weight="800" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#1e293b" text-anchor="start" dominant-baseline="middle">否则</text><rect x="76" y="314" width="984" height="56" rx="14" ry="14" fill="#9966ff" stroke="#774dcb" stroke-width="3"/><text x="96" y="342" font-size="22" font-weight="800" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#1e293b" text-anchor="start" dominant-baseline="middle">说  「没有中奖」</text><text x="40" y="490" font-size="20" font-weight="800" font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#475569" text-anchor="start" dominant-baseline="middle">点图片可以放大。随机数是 4、5、6、7、8 就说中奖啦。</text></svg>